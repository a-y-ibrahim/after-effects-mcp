name: Publish to npm

on:
  release:
    types: [published]

# Least privilege: only the publish job escalates, and only to what it needs.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: read
      id-token: write # required for npm provenance

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches the release tag
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_NAME="${{ github.event.release.tag_name }}"
          # release-please's tag format depends on include-component-in-tag in
          # release-please-config.json ("vX.Y.Z" when false, "<package>-vX.Y.Z"
          # when true or unset - true is release-please's own default). Strip
          # that optional package-name prefix before comparing, so this check
          # stays correct either way instead of hard-failing every publish if
          # that setting ever changes (caught live: a v1.11.0 release publish
          # failed here when the config didn't set it, tagging
          # "after-effects-mcp-v1.11.0" against this check's un-stripped
          # "v1.11.0" expectation).
          TAG_VERSION="${TAG_NAME#"$PKG_NAME"-}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match the release tag ($TAG_NAME)"
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
